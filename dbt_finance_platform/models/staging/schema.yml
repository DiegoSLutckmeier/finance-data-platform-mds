version: 2

models:
  - name: stg_stripe_payment_intents
    description: Cleaned and deduplicated Stripe payment intents from the Bronze layer.
    columns:
      - name: payment_intent_id
        description: Primary key for the Stripe payment intent.
        data_tests:
          - unique
          - not_null
      - name: status
        description: Current Stripe payment intent status.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - requires_payment_method
                - requires_confirmation
                - requires_action
                - processing
                - requires_capture
                - canceled
                - succeeded
      - name: currency
        description: Three-letter lowercase currency code.
        data_tests:
          - not_null
      - name: amount_cents
        description: Payment intent amount in the currency's smallest unit.
        data_tests:
          - not_null

